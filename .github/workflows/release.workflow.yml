name: Release

# Publishes a version from every push to a release branch (see .releaserc.json):
#   master   → npm dist-tag `latest`
#   <N>-dev  → prereleases (`N.0.0-beta.M`), npm dist-tag `beta`
#
# npm authenticates the publish with this workflow's OIDC token (trusted
# publishing): no npm token is involved. The trusted publisher registered on
# npmjs.com names this file, `release.workflow.yml`: renaming it breaks the
# publication until the npm setting is updated too.

on:
  push:
    branches:
      - master
      - "[0-9]+-dev"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.workflow.yml

  release:
    name: semantic-release
    runs-on: ubuntu-24.04
    needs: [tests]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The release commit and tag are pushed with the GitHub App token
          # below, not with the default GITHUB_TOKEN.
          persist-credentials: false

      # No `registry-url`: it writes an .npmrc that reads NODE_AUTH_TOKEN, and
      # its placeholder token would be sent instead of the OIDC exchange.
      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Installed here only: semantic-release is not a development dependency.
      - name: Install semantic-release
        run: npm install --no-save semantic-release-config-kuzzle@1.7.3

      - run: npm run build

      # client-id replaces the deprecated app-id: the action passes the value as-is
      # as the JWT iss, which GitHub accepts as a Client ID or a numeric App ID,
      # hence the unchanged KUZZLE_BOT_APP_ID variable.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SEMANTIC_RELEASE_NPM_PUBLISH: "true"
          SEMANTIC_RELEASE_SLACK_WEBHOOK: ${{ secrets.SEMANTIC_RELEASE_SLACK_WEBHOOK }}
        run: npx semantic-release

  # Rebuilds the user documentation (doc/1/) on docs.kuzzle.io: master is
  # deployed to production, <N>-dev to next-docs.kuzzle.io (staging). The
  # section is registered in kuzzleio/documentation (repositories.json,
  # sections.json) as kuzzle-prometheus, version 1.
  documentation:
    name: Documentation - Deploy
    runs-on: ubuntu-24.04
    needs: [release]
    steps:
      - uses: convictional/trigger-workflow-and-wait@f69fa9eedd3c62a599220f4d5745230e237904be # v1.6.5
        with:
          owner: kuzzleio
          repo: documentation
          github_token: ${{ secrets.ACCESS_TOKEN_CI }}
          workflow_file_name: child_repo.workflow.yml
          ref: ${{ github.ref_name == 'master' && 'master' || 'develop' }}
          client_payload: '{"repo_name":"kuzzle-prometheus","branch":"${{ github.ref_name }}","version":"1"}'
